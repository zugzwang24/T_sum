services:
  postgres:
    image: postgres:16-alpine
    container_name: t_sum_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: t_sum
      POSTGRES_USER: t_sum_user
      POSTGRES_PASSWORD: t_sum_password
    ports:
      - "5432:5432"
    volumes:
      - t_sum_postgres_data:/var/lib/postgresql/data

volumes:
  t_sum_postgres_data:
